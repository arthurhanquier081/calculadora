<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Fullstack</title>
    <style>
    /* 1. Fundo do site inteiro */
    body {
        background-color: #0f172a; /* Azul marinho escuro */
        color: #ffffff;
        font-family: Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
    }

    /* 2. Fundo do card da calculadora */
    .calculadora {
        background-color: #1e293b; /* Card em tom ligeiramente mais claro */
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 8px 24px rgba(0,0,0,0.6);
        text-align: center;
        width: 300px;
    }

    /* Campos de entrada e seleção */
    input, select {
        margin: 10px 0;
        padding: 12px;
        width: 100%;
        box-sizing: border-box;
        background-color: #334155;
        color: white;
        border: 1px solid #475569;
        border-radius: 6px;
        font-size: 1rem;
    }

    /* Botão com destaque Verde */
    button {
        margin: 10px 0;
        padding: 12px;
        width: 100%;
        box-sizing: border-box;
        background-color: #28a745; 
        color: white;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-size: 1rem;
        font-weight: bold;
        transition: 0.3s;
    }
    button:hover {
        background-color: #218838;
    }

    #resultado {
        margin-top: 15px;
        font-size: 1.2rem;
        font-weight: bold;
        color: #4ade80; /* Texto do resultado em tom verde claro */
    }
</style>
</head>
<body>
    <div class="calculadora">
        <h2>Calculadora</h2>
        <input type="number" id="num1" placeholder="Primeiro número">
        <select id="operacao">
            <option value="+">Somar (+)</option>
            <option value="-">Subtrair (-)</option>
            <option value="*">Multiplicar (*)</option>
            <option value="/">Dividir (/)</option>
        </select>
        <input type="number" id="num2" placeholder="Segundo número">
        <button id="btn-calcular" onclick="fazerCalculo()">Calcular</button>
        <div id="resultado"></div>
    </div>

    <script>
        async function fazerCalculo() {
            const num1 = parseFloat(document.getElementById('num1').value);
            const operacao = document.getElementById('operacao').value;
            const num2 = parseFloat(document.getElementById('num2').value);

            if (isNaN(num1) || isNaN(num2)) {
                document.getElementById('resultado').innerText = "Preencha os dois números!";
                return;
            }

            const resposta = await fetch('/calcular', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ num1, operacao, num2 })
            });

            const dados = await resposta.json();
            document.getElementById('resultado').innerText = `Resultado: ${dados.resultado}`;
        }
    </script>
</body>
</html>
