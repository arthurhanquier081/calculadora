<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Fullstack</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .calculadora {
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            text-align: center;
            width: 300px;
        }
        input, select, button {
            margin: 10px 0;
            padding: 12px;
            width: 100%;
            box-sizing: border-box;
            background-color: #2c2c2c;
            color: white;
            border: 1px solid #444;
            border-radius: 5px;
            font-size: 1rem;
        }
        button {
            background-color: #333333; 
            border: none;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }
        button:hover {
            background-color: #555555;
        }
        #resultado {
            margin-top: 15px;
            font-size: 1.2rem;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="calculadora">
        <h2>Calculadora</h2>
        <input type="number" id="num1" placeholder="Primeiro número">
        <select id="operacao">
            <option value="+">Somar (+)</option>
            <option value="-">Subtrair (-)</option>
            <option value="*">Multiplicar (*)</option>
            <option value="/">Dividir (/)</option>
        </select>
        <input type="number" id="num2" placeholder="Segundo número">
        <button id="btn-calcular" onclick="fazerCalculo()">Calcular</button>
        <div id="resultado"></div>
    </div>

    <script>
        async function fazerCalculo() {
            const num1 = parseFloat(document.getElementById('num1').value);
            const operacao = document.getElementById('operacao').value;
            const num2 = parseFloat(document.getElementById('num2').value);

            if (isNaN(num1) || isNaN(num2)) {
                document.getElementById('resultado').innerText = "Preencha os dois números!";
                return;
            }

            const resposta = await fetch('/calcular', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ num1, operacao, num2 })
            });

            const dados = await resposta.json();
            document.getElementById('resultado').innerText = `Resultado: ${dados.resultado}`;
        }
    </script>
</body>
</html>
